<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOMI</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #111; color: #eee;
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 14px 16px; border-bottom: 1px solid #222; font-weight: 700;
           text-align: center; letter-spacing: 6px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
         max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; line-height: 1.45; }
  .user { align-self: flex-end; background: #2563eb; }
  .bot { align-self: flex-start; background: #1f1f1f; border: 1px solid #2a2a2a; }
  .err { align-self: flex-start; background: #3a1515; border: 1px solid #7a2a2a; }
  form { display: flex; align-items: flex-end; gap: 8px; margin: 0 auto 20px;
         width: calc(100% - 32px); max-width: 760px; background: #1a1a1a;
         border: 1px solid #333; border-radius: 28px; padding: 12px 12px 12px 20px; }
  textarea { flex: 1; resize: none; background: transparent; color: #eee; border: 0;
             outline: none; font: inherit; min-height: 56px; max-height: 160px; padding: 8px 0; }
  button { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
           background: #eee; color: #111; border: 0; font-size: 18px; line-height: 1;
           cursor: pointer; display: flex; align-items: center; justify-content: center; }
  button:disabled { opacity: .4; cursor: default; }
  .typing { opacity: .8; }
  .spinner { display: inline-block; width: 12px; height: 12px; margin-right: 8px;
             border: 2px solid #555; border-top-color: #eee; border-radius: 50%;
             animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dots::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
</style>
</head>
<body>
<header>NOMI</header>
<div id="log"></div>
<form id="f">
  <textarea id="in" placeholder="Type a prompt, Enter to send…" autofocus></textarea>
  <button id="send" aria-label="Send">↑</button>
</form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('f');
const input = document.getElementById('in');
const send = document.getElementById('send');

function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const prompt = input.value.trim();
  if (!prompt) return;
  add(prompt, 'user');
  input.value = '';
  send.disabled = true;
  const t = add('', 'bot typing');
  t.innerHTML = '<span class="spinner"></span><span class="dots">thinking</span>';
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    const data = await r.json();
    t.classList.remove('typing');
    t.textContent = r.ok ? (data.output || '(empty)') : ('Error: ' + (data.error || r.status));
    if (!r.ok) t.className = 'msg err';
  } catch (err) {
    t.className = 'msg err';
    t.textContent = 'Error: ' + err.message;
  }
  send.disabled = false;
  input.focus();
  log.scrollTop = log.scrollHeight;
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
</script>
</body>
</html>
